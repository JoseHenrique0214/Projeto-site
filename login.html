<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MarketWatch</title>
    <link rel="stylesheet" href="estilo/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                    <span>MarketWatch</span>
                </div>
                <h1>Bem-vindo de volta</h1>
                <p>Acesse sua dashboard de mercado financeiro</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input 
                        type="text" 
                        id="email" 
                        name="email" 
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="senha">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-input">
                        <input 
                            type="password" 
                            id="senha" 
                            name="senha" 
                            placeholder="Digite sua senha"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="senhaError"></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="lembrar">
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-login">
                    <span class="btn-text">Entrar</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>Não tem uma conta? <a href="#" id="criarContaLink">Criar conta</a></p>
            </div>

            <!-- Informações de teste -->
            <div class="demo-info">
                <i class="fas fa-info-circle"></i>
                <p><strong>Acesso de demonstração:</strong></p>
                <p>Email: <code>admin@marketwatch.com</code></p>
                <p>Senha: <code>1234</code></p>
            </div>
        </div>

        <!-- Modal de Criar Conta -->
        <div id="criarContaModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Criar Nova Conta</h2>
                    <button class="close-modal" id="closeModal">&times;</button>
                </div>
                <form id="cadastroForm" class="cadastro-form">
                    <div class="form-group">
                        <label for="novoNome">Nome Completo</label>
                        <input type="text" id="novoNome" required placeholder="Seu nome">
                    </div>
                    <div class="form-group">
                        <label for="novoEmail">Email</label>
                        <input type="email" id="novoEmail" required placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="novaSenha">Senha</label>
                        <input type="password" id="novaSenha" required placeholder="Mínimo 4 caracteres" minlength="4">
                    </div>
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Senha</label>
                        <input type="password" id="confirmarSenha" required placeholder="Digite a senha novamente">
                    </div>
                    <button type="submit" class="btn-cadastrar">Criar Conta</button>
                </form>
            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
</body>
</html>
